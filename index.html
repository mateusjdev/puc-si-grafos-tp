<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoC - Visualizador de Linhas OpenStreetMap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #map-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color: #FFFFFF;
      cursor: grab;
    }

    #map-canvas:active {
      cursor: grabbing;
    }

    /* Painel HUD flutuante */
    .hud-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      font-size: 13px;
      color: #222222;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .hud-title {
      font-weight: 700;
      font-size: 14px;
      color: #111111;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-stat {
      color: #555555;
    }

    .hud-stat strong {
      color: #111111;
    }

    .hud-controls {
      margin-top: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #222222;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #F4F4F4;
      border-color: #999999;
    }

    .btn:active {
      background: #EAEAEA;
    }

    /* Overlay de Carregamento e Mensagens */
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 24px 32px;
      border-radius: 10px;
      border: 1px solid #E0E0E0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      z-index: 10;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #E0E0E0;
      border-top-color: #111111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <canvas id="map-canvas"></canvas>

  <div id="status-overlay">
    <div id="overlay-spinner" class="spinner"></div>
    <div id="overlay-msg" style="font-size: 15px; color: #333;">Carregando vias de <code>edges.json</code>...</div>
  </div>

  <div class="hud-panel">
    <div class="hud-title">
      <span>PoC Malha Viária (OSM)</span>
    </div>
    <div class="hud-stat" id="stat-edges">Arestas: <strong>Carregando...</strong></div>
    <div class="hud-stat" id="stat-zoom">Zoom: <strong>100%</strong></div>
    <div class="hud-controls">
      <button class="btn" id="btn-reset">Centralizar Vista</button>
      <button class="btn" id="btn-zoom-in">+</button>
      <button class="btn" id="btn-zoom-out">-</button>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('map-canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('status-overlay');
      const overlayMsg = document.getElementById('overlay-msg');
      const overlaySpinner = document.getElementById('overlay-spinner');
      const statEdges = document.getElementById('stat-edges');
      const statZoom = document.getElementById('stat-zoom');
      const btnReset = document.getElementById('btn-reset');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');

      // Dados de arestas e bounding box
      let edgesData = [];
      let bbox = { minLon: 0, minLat: 0, maxLon: 0, maxLat: 0 };
      let cosLatMean = 1.0;

      // Transformação de visualização (Pan & Zoom)
      // Representa o offset (em pixels) e escala de exibição
      let transform = {
        x: 0,
        y: 0,
        scale: 1.0
      };

      // Escala e centro base para centralizar perfeitamente no canvas
      let defaultTransform = { x: 0, y: 0, scale: 1.0 };

      // Estado do mouse para Pan
      let isDragging = false;
      let startMouse = { x: 0, y: 0 };
      let startTransform = { x: 0, y: 0 };

      // Ajuste de DPI do canvas
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        render();
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        if (edgesData.length > 0) {
          fitToBounds();
          render();
        }
      });

      // Conversão de coordenadas geográficas [lon, lat] para coordenadas de mundo planas (metros proporcionais)
      // x = (lon - minLon) * cos(lat_media)
      // y = -(lat - minLat)  <-- invertendo eixo Y (Norte para cima)
      function project(lon, lat) {
        return {
          x: (lon - bbox.minLon) * cosLatMean,
          y: -(lat - bbox.minLat)
        };
      }

      // Calcula a escala e o pan iniciais para caber na tela com margem
      function fitToBounds() {
        if (!edgesData || edgesData.length === 0) return;

        const pMin = project(bbox.minLon, bbox.minLat);
        const pMax = project(bbox.maxLon, bbox.maxLat);

        const worldWidth = Math.abs(pMax.x - pMin.x);
        const worldHeight = Math.abs(pMin.y - pMax.y);

        if (worldWidth === 0 || worldHeight === 0) return;

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        const padding = 40; // Margem em pixels nas bordas

        const availW = Math.max(100, screenW - padding * 2);
        const availH = Math.max(100, screenH - padding * 2);

        // Manter aspecto exato (evita distorção)
        const scale = Math.min(availW / worldWidth, availH / worldHeight);

        // Centro do mundo projetado
        const worldCenterX = (pMin.x + pMax.x) / 2;
        const worldCenterY = (pMin.y + pMax.y) / 2;

        // Posição para centralizar na tela
        const screenCenterX = screenW / 2;
        const screenCenterY = screenH / 2;

        transform.scale = scale;
        transform.x = screenCenterX - worldCenterX * scale;
        transform.y = screenCenterY - worldCenterY * scale;

        defaultTransform = { ...transform };
        updateHud();
      }

      function updateHud() {
        const zoomPercent = Math.round((transform.scale / (defaultTransform.scale || 1)) * 100);
        statZoom.innerHTML = `Zoom: <strong>${zoomPercent}%</strong>`;
      }

      // Função principal de desenho
      function render() {
        const dpr = window.devicePixelRatio || 1;
        ctx.save();

        // Limpa com fundo branco puro
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ajuste de DPI
        ctx.scale(dpr, dpr);

        if (edgesData.length === 0) {
          ctx.restore();
          return;
        }

        // Aplica transformações de Pan e Zoom
        ctx.translate(transform.x, transform.y);
        ctx.scale(transform.scale, transform.scale);

        // Configuração de estilo das arestas: linhas finas e nítidas
        ctx.strokeStyle = '#111111';
        // Ajusta a espessura para permanecer nítida de 1px na tela independentemente do zoom
        ctx.lineWidth = 1 / transform.scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        for (let i = 0; i < edgesData.length; i++) {
          const line = edgesData[i];
          if (line.length < 2) continue;

          const p0 = project(line[0][0], line[0][1]);
          ctx.moveTo(p0.x, p0.y);

          for (let j = 1; j < line.length; j++) {
            const p = project(line[j][0], line[j][1]);
            ctx.lineTo(p.x, p.y);
          }
        }
        ctx.stroke();

        ctx.restore();
      }

      // Eventos de Pan (arrastar com mouse)
      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // Apenas botão esquerdo
        isDragging = true;
        startMouse = { x: e.clientX, y: e.clientY };
        startTransform = { x: transform.x, y: transform.y };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startMouse.x;
        const dy = e.clientY - startMouse.y;
        transform.x = startTransform.x + dx;
        transform.y = startTransform.y + dy;
        render();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Evento de Zoom com scroll do mouse centrado na posição do cursor
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8333;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // Ponto no mundo antes do zoom
        const worldX = (mouseX - transform.x) / transform.scale;
        const worldY = (mouseY - transform.y) / transform.scale;

        // Atualiza escala
        transform.scale *= zoomFactor;

        // Reposiciona o pan para que o ponto sob o mouse permaneça no mesmo local na tela
        transform.x = mouseX - worldX * transform.scale;
        transform.y = mouseY - worldY * transform.scale;

        updateHud();
        render();
      }, { passive: false });

      // Botões do HUD
      btnReset.addEventListener('click', () => {
        transform = { ...defaultTransform };
        updateHud();
        render();
      });

      btnZoomIn.addEventListener('click', () => {
        const center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const worldX = (center.x - transform.x) / transform.scale;
        const worldY = (center.y - transform.y) / transform.scale;
        transform.scale *= 1.3;
        transform.x = center.x - worldX * transform.scale;
        transform.y = center.y - worldY * transform.scale;
        updateHud();
        render();
      });

      btnZoomOut.addEventListener('click', () => {
        const center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const worldX = (center.x - transform.x) / transform.scale;
        const worldY = (center.y - transform.y) / transform.scale;
        transform.scale *= 0.77;
        transform.x = center.x - worldX * transform.scale;
        transform.y = center.y - worldY * transform.scale;
        updateHud();
        render();
      });

      // Carregamento dos dados
      async function loadData() {
        try {
          const res = await fetch('./edges.json');
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: Arquivo edges.json não encontrado.`);
          }
          const data = await res.json();

          if (!data.edges || data.edges.length === 0) {
            throw new Error("Nenhuma aresta (LineString) encontrada no arquivo.");
          }

          edgesData = data.edges;

          // Se a bbox veio no JSON usamos ela, senão calculamos
          if (data.bbox && data.bbox.minLon !== undefined) {
            bbox = data.bbox;
          } else {
            // Calcula bounding box manualmente
            let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
            for (const edge of edgesData) {
              for (const [lon, lat] of edge) {
                if (lon < minLon) minLon = lon;
                if (lat < minLat) minLat = lat;
                if (lon > maxLon) maxLon = lon;
                if (lat > maxLat) maxLat = lat;
              }
            }
            bbox = { minLon, minLat, maxLon, maxLat };
          }

          // Correção de projeção: cos da latitude média (em radianos)
          const meanLat = (bbox.minLat + bbox.maxLat) / 2;
          cosLatMean = Math.cos(meanLat * Math.PI / 180);

          statEdges.innerHTML = `Arestas: <strong>${edgesData.length.toLocaleString('pt-BR')}</strong>`;
          overlay.classList.add('hidden');

          resizeCanvas();
          fitToBounds();
          render();

        } catch (err) {
          overlaySpinner.classList.add('hidden');
          overlayMsg.innerHTML = `
            <strong style="color: #c00;">Atenção:</strong><br>
            ${err.message}<br><br>
            <span style="font-size: 13px; color: #555;">
              Certifique-se de que o arquivo <code>export.geojson</code> existe na raiz<br>
              e execute <code>python process.py</code> ou inicie com <code>python server.py</code>.
            </span>
          `;
        }
      }

      // Inicia
      resizeCanvas();
      loadData();
    })();
  </script>
</body>
</html>
